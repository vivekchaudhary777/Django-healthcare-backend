databases:
  - name: healthcare-db
    databaseName: healthcare
    user: healthcare
    plan: basic-256mb

services:
  - type: web
    name: healthcare-backend-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: healthcare-backend-api.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
